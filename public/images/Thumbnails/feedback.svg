<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3585"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d1f5e"/>
    </linearGradient>
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#f1892b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="titleShadow">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Subtle radial light behind stars -->
  <radialGradient id="centerLight" cx="50%" cy="62%" r="40%">
    <stop offset="0%" stop-color="#2a4faa" stop-opacity="1"/>
    <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
  </radialGradient>
  <rect width="1280" height="720" fill="url(#centerLight)"/>

  <!-- Decorative circle accents (top-left / bottom-right) -->
  <circle cx="60" cy="60" r="120" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06"/>
  <circle cx="60" cy="60" r="200" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>
  <circle cx="1220" cy="660" r="150" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06"/>
  <circle cx="1220" cy="660" r="260" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04"/>

  <!-- Horizontal divider line under title area -->
  <line x1="340" y1="195" x2="940" y2="195" stroke="#f1892b" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Title: FEEDBACK -->
  <text
    x="640" y="165"
    font-family="Arial Black, Impact, sans-serif"
    font-size="118"
    font-weight="900"
    fill="#f1892b"
    text-anchor="middle"
    letter-spacing="8"
    filter="url(#titleShadow)"
  >FEEDBACK</text>

  <!-- 5 Stars — drawn as individual star polygons for sharp render -->
  <!-- Star centres: 190, 380, 570, 760, 950 | y centre: 450 | size: 80 -->

  <!-- Star 1 -->
  <polygon points="190,340 205,390 258,390 215,420 230,470 190,442 150,470 165,420 122,390 175,390"
    fill="url(#starGlow)" filter="url(#softGlow)"/>

  <!-- Star 2 -->
  <polygon points="380,340 395,390 448,390 405,420 420,470 380,442 340,470 355,420 312,390 365,390"
    fill="url(#starGlow)" filter="url(#softGlow)"/>

  <!-- Star 3 (centre — slightly larger) -->
  <polygon points="640,325 658,382 718,382 670,416 688,473 640,441 592,473 610,416 562,382 622,382"
    fill="url(#starGlow)" filter="url(#softGlow)"/>

  <!-- Star 4 -->
  <polygon points="900,340 915,390 968,390 925,420 940,470 900,442 860,470 875,420 832,390 885,390"
    fill="url(#starGlow)" filter="url(#softGlow)"/>

  <!-- Star 5 -->
  <polygon points="1090,340 1105,390 1158,390 1115,420 1130,470 1090,442 1050,470 1065,420 1022,390 1075,390"
    fill="url(#starGlow)" filter="url(#softGlow)"/>

  <!-- Subtitle text -->
  <text
    x="640" y="560"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="400"
    fill="#93c5fd"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.9"
  >Share your experience</text>

  <!-- Small rating label -->
  <text
    x="640" y="615"
    font-family="Arial, Helvetica, sans-serif"
    font-size="26"
    fill="#f1892b"
    text-anchor="middle"
    opacity="0.6"
    letter-spacing="1"
  >Artisbay Inc. · Customer Reviews</text>
</svg>
