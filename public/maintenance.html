<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artisbay — Back Shortly</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0f1a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(241,137,43,0.15);
      border: 1px solid rgba(241,137,43,0.4);
      color: #f1892b;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      margin-bottom: 2rem;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f1892b;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #cbd5e1;
      margin-bottom: 1.5rem;
    }
    .logo span { color: #1da1f2; }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 1.25rem;
      background: linear-gradient(120deg, #1e3a8a 0%, #1da1f2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1rem;
      color: #94a3b8;
      text-align: center;
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .refresh-note {
      font-size: 0.75rem;
      color: #475569;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(120deg, #1e3a8a 0%, #1da1f2 100%);
      border-radius: 2px;
      margin: 0 auto 2.5rem;
    }
  </style>
</head>
<body>
  <div class="badge"><span class="dot"></span> Maintenance in Progress</div>
  <div class="logo">Artis<span>bay</span></div>
  <h1>We'll be right back.</h1>
  <div class="divider"></div>
  <p>We're performing a quick update to improve your experience. The site will be back online shortly — no action needed on your end.</p>
  <p class="refresh-note">This page refreshes automatically every 5 seconds.</p>
  <script>setTimeout(function(){ location.replace('/?' + Date.now()); }, 5000);</script>
</body>
</html>
